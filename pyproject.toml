[project]
name = "optimus"
description = "Flow-aware performance profiler for Frappe and ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
	# "frappe~=15.0.0" # Installed and managed by bench.
	"pyinstrument>=4.6,<6",
	# Phase 2 line profiling depends on the sys.monitoring tool-2 path
	# that arrived in line_profiler 5.x; the 4.x line uses the legacy
	# sys.settrace mechanism that the leak fix in 6f66a43 does NOT
	# protect (a botched 4.x teardown leaks a different tracing hook).
	# Pin >=5.0 so Phase 2's leak-resistant release_monitoring_tool() +
	# the 10s overhead-budget watchdog (4357c8f) actually apply.
	"line_profiler>=5.0,<6",
	# Already a transitive Frappe dependency; declared explicitly because
	# ai_fix.py imports it directly to call the configured LLM endpoint.
	"requests>=2.28",
	# Transitive Frappe deps used by app code at module top declared
	# explicitly so the suite installs cleanly on a non-bench Python
	# (CI runner) without pulling in all of Frappe.
	"sqlparse>=0.4",
	"Jinja2>=3.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
